# Example configuration for JSON utilities.
# Copy this file to `json_utils.config.yaml` to have it picked up automatically
# when running `python -m privacy_pipeline.cli json-utils ...`.

list_values:
  inputs: [image_index.jsonl]
  attributes: [lab, building]

summarize:
  inputs: [yoloe_output.jsonl]
  attributes: [lab, building]
  filters:
    - {lab: alpha}

merge_filtered:
  stage: yoloe
  base_dir: filtered
  output: merged_yoloe_output.jsonl
