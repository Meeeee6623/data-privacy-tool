# Example configuration covering all available options for the privacy pipeline.
# Copy this file to `config.yaml` to have it picked up automatically by the CLI.

# Dataset indexing options
# Controls how image metadata is collected from the filesystem and any user JSONL.
dataset:
  # Root directory to search for images
  image_root: /usr/project/xtmp/bsc32/droid
  # Whether to recurse into subdirectories while globbing images
  recursive: true
  # Optional attributes derived from the directory hierarchy (root-relative), eg. for root/a/b/c/d/e.jpg, lab=a, building=b, scene=c
  path_attributes: [lab, building, scene]
  # Optional attributes derived from walking up the file path (1 = parent dir)
  # path_attribute_map:
  #   lab: 3
  #   building: 2
  #   scene: 1
  # Optional JSONL to merge in user-provided attributes
  # user_jsonl: /path/to/custom_attributes.jsonl
  # Output JSONL containing the image index (defaults to image_index.jsonl)
  output_jsonl: image_index.jsonl

# YOLOE inference options
# Configures thresholds, visualization, and filtering for the detector.
yoloe:
  # Path to the YOLOE checkpoint; downloaded automatically if missing. Should be a variant of yoloe-11-seg
  model_path: yoloe-11l-seg.pt
  # Confidence threshold for detections
  threshold: 0.5
  # Whether to save visualization images alongside detections
  visualize: true
  # Where to store visualization images (only used when visualize is true)
  visualization_dir: yoloe_visualizations
  # Output JSONL containing YOLOE detections
  output_jsonl: yoloe_output.jsonl
  # Optional filters to restrict which index records are processed
  attribute_filters:
    building: BWW

# Gemini / VLLM OCR options
# Controls batch preparation, upload/submission, and output parsing.
gemini:
  # Prompt passed to Gemini for OCR/classification
  prompt: "<your prompt>"
  # YOLOE classes that trigger Gemini processing
  classes_to_forward: [person, screen]
  # Minimum YOLOE confidence required to forward a detection to Gemini
  min_confidence: 0.5
  # Directory depth used to group images into scenes (1 = immediate parent)
  scene_directory_level: 2
  # Maximum batch size (in bytes) for Gemini upload
  max_batch_size_bytes: 1981808640  # 1.85 GB
  # Directory where batch JSONL files are written
  output_batch_dir: gemini_batches
  # Optional bucket/project details for uploads and submissions
  gcs_bucket: your-bucket
  project: your-gcp-project
  # Optional location and model overrides
  location: us-central1
  model: gemini-2.0-flash
  # Path where submitted job names are tracked
  submitted_jobs_file: gemini_jobs.json
  # Final parsed output JSONL path
  final_output_jsonl: gemini_output.jsonl
  # Optional filters to restrict which detections are forwarded
  attribute_filters:
    building: BWW
